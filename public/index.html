<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOZ</title>
<meta name="description" content="Voz của tui, xài voz theo cách của tui">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/voz-icon-32.png">
<link rel="apple-touch-icon" sizes="192x192" href="/assets/img/voz-icon-192.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#193458">
<link rel="preconnect" href="https://data.voz.vn">
<!-- The default reading face, preloaded before any stylesheet so the first text paint already has it. The
     inline script below drops this link when the reader picked a different family. -->
<link rel="preload" id="font-preload" href="/assets/fonts/be-vietnam-400.woff2" as="font" type="font/woff2" crossorigin>
<!-- One bundle instead of 16 stylesheets: 16 render-blocking requests cost ~4.4s on Slow 4G. Rebuild with
     `node tools/build-css.mjs` after editing any file in assets/css/. -->
<link rel="stylesheet" href="/assets/css/app.css">
<script>
  // Runs while the head is still parsing, before anything paints, so a dark-mode reader never
  // sees a white flash. Only the attributes the CSS keys off, read from localStorage;
  // everything else lives in ui/theme.js.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('voz-settings:v1') || '{}');
      var mode = ['auto', 'light', 'dark'].indexOf(s.theme) >= 0 ? s.theme : 'auto';
      var dark = mode === 'dark' ||
        (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var r = document.documentElement;
      r.dataset.themeMode = mode;
      r.dataset.theme = dark ? 'dark' : 'light';
      // Family stacks mirror FONT_STACKS in lib/settings.js. The default `be-vietnam` is already
      // declared by font-default.css, so only a different family needs --font set. Unknown
      // values fall back to the default, matching normalizeSettings().
      var FONT_STACKS = {
        system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
        roboto: 'Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif',
        cantarell: '"Cantarell", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
        'be-vietnam-pro': '"Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
        'sf-pro-display': '"SF Pro Display", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
        'segoe-ui': '"Segoe UI Local", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
      };
      var font = Object.prototype.hasOwnProperty.call(FONT_STACKS, s.font) ? s.font : 'be-vietnam';
      r.dataset.font = font;
      // The default is already applied by base.css, so its inline value is cleared; every other
      // choice needs its own stack here.
      if (font === 'be-vietnam') r.style.removeProperty('--font');
      else r.style.setProperty('--font', FONT_STACKS[font]);
      // The preload in the head is unconditional so it starts with the first byte; drop it when the reader reads
      // in another family, so the 20 KB is not spent for nothing.
      if (font !== 'be-vietnam') document.getElementById('font-preload')?.remove();
              // Font size percentages, applied pre-paint; mirrored by applyFontScale() in
              // ui/theme.js.
              var scale = function (v) {
                var isText = typeof v === 'string';
                if (isText && v.trim() === '') return 100;
                if (!isText && typeof v !== 'number') return 100;
                var n = Number(v);
                if (!isFinite(n)) return 100;
                n = Math.round(n / 5) * 5;
                return Math.min(200, Math.max(80, n));
              };
              r.style.setProperty('--post-scale', String(scale(s.postSize) / 100));
              r.style.setProperty('--ui-scale', String(scale(s.uiSize) / 100));
            } catch (e) { /* storage disabled: fall through to the light default */ }
  })();
</script>
<!-- Route-only stylesheets: `async` keeps them out of the critical path, and `onload` promotes them once they
     arrive. Render-blocking CSS is what pushed Speed Index to 4.1s. -->
<link rel="stylesheet" href="/assets/css/settings.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/assets/css/stickers.css" media="print" onload="this.media='all'">
<noscript>
<link rel="stylesheet" href="/assets/css/settings.css">
<link rel="stylesheet" href="/assets/css/stickers.css">
</noscript>
</head>
<body>
<header class="p-header">
  <div class="p-header-inner">
    <a class="p-header-logo" href="/" aria-label="VOZ — về trang chủ">
      <img src="/assets/img/voz-lockup.svg" alt="VOZ" width="348" height="177" decoding="async">
    </a>
    <div class="p-header-account" id="header-account"></div>
  </div>
</header>

<nav class="p-nav">
  <div class="p-nav-inner">
    <ul class="p-nav-list" id="nav-list"></ul>
  </div>
</nav>

<main class="p-body">
  <div class="p-body-inner">
    <div class="p-breadcrumbs" id="breadcrumbs"></div>
    <div id="app" class="p-body-pageContent"></div>
  </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
